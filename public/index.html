<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Claude">
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%230d1117' width='100' height='100' rx='20'/><text y='.9em' font-size='80' x='50%' text-anchor='middle'>⚡</text></svg>">
  <title>Claude Remote</title>
  <!-- Prism.js for syntax highlighting (lazy-loaded) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" integrity="sha512-vswe+cgvic/XBoF1OcM/TeJ2FW0OofqAVdCZiEYkd6dwGXthvkSFWOoGGJgS2CW70VK5dQM5Oh+7ne47s74VTg==" crossorigin="anonymous" referrerpolicy="no-referrer" media="print" onload="this.media='all'">
  <style>
    :root {
      --bg-primary: #0d1117;
      --bg-secondary: #161b22;
      --bg-tertiary: #21262d;
      --bg-input: #0d1117;
      --accent: #58a6ff;
      --accent-dim: #388bfd;
      --text-primary: #e6edf3;
      --text-secondary: #8b949e;
      --text-muted: #6e7681;
      --border: #30363d;
      --success: #3fb950;
      --warning: #d29922;
      --error: #f85149;
      --user-msg: #1f6feb;
      --assistant-msg: #238636;
      --tool-msg: #8957e5;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: var(--bg-secondary);
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      padding-top: max(12px, env(safe-area-inset-top));
      gap: 12px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--error);
      flex-shrink: 0;
    }
    .status-dot.connected { background: var(--success); }
    .status-dot.reconnecting {
      background: var(--warning);
      animation: pulse 1s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    /* Respect user's reduced-motion preference (accessibility) */
    @media (prefers-reduced-motion: reduce) {
      .status-dot.reconnecting {
        animation: none;
      }
    }

    .session-selector {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: var(--text-primary);
      font-size: 0.9rem;
      flex: 1;
      min-width: 0;
      max-width: 200px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      color: var(--text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .icon-btn:active { transform: scale(0.95); }
    .icon-btn.active { background: var(--accent); color: white; border-color: var(--accent); }

    /* Auth Screen */
    .auth-screen {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 20px;
    }
    .auth-screen.hidden { display: none; }

    .auth-box {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 24px;
      max-width: 400px;
      margin: 0 auto;
      width: 100%;
    }

    .auth-box h2 {
      margin-bottom: 20px;
      font-size: 1.3rem;
      text-align: center;
    }

    /* Main App */
    .main-app {
      flex: 1;
      display: none;
      flex-direction: column;
      overflow: hidden;
    }
    .main-app.active { display: flex; }

    /* Output Area - Terminal Style */
    .output-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      scroll-behavior: smooth;
      font-family: 'SF Mono', 'Menlo', 'Monaco', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.4;
      background: var(--bg-primary);
    }

    .message {
      padding: 4px 0;
      word-wrap: break-word;
      width: 100%;
    }

    .message.user {
      color: var(--accent);
    }

    .message.user::before {
      content: '❯ ';
      color: var(--success);
      font-weight: bold;
    }

    .message.assistant {
      color: var(--text-primary);
      padding-left: 0;
      border-left: 2px solid var(--success);
      padding-left: 8px;
      margin: 4px 0;
    }

    .message.assistant.speaking {
      border-left-color: var(--accent);
      background: rgba(88, 166, 255, 0.05);
    }

    .message.tool {
      color: var(--tool-msg);
      font-size: 12px;
      opacity: 0.9;
    }

    .message.tool .tool-name {
      color: var(--tool-msg);
      font-weight: 600;
      display: inline;
    }

    .message.tool .tool-name::before {
      content: '⚙ ';
    }

    .message.tool_result {
      color: var(--text-muted);
      font-size: 11px;
    }

    /* Collapsible tool messages */
    .message.tool, .message.tool_result {
      cursor: pointer;
    }

    .message.tool .tool-details,
    .message.tool_result .tool-details {
      display: none;
      margin-top: 8px;
      padding: 8px;
      background: var(--bg-primary);
      border-left: 2px solid var(--tool-msg);
      font-size: 11px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    .message.tool.expanded .tool-details,
    .message.tool_result.expanded .tool-details {
      display: block;
    }

    .tool-summary {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tool-chevron {
      transition: transform 0.2s;
    }

    .expanded .tool-chevron {
      transform: rotate(90deg);
    }

    .message pre {
      white-space: pre-wrap;
      word-break: break-word;
      margin: 0;
      font-family: inherit;
    }

    /* Streaming indicator */
    .streaming {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .streaming-dots {
      display: flex;
      gap: 4px;
    }

    .streaming-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.4s infinite ease-in-out;
    }
    .streaming-dots span:nth-child(1) { animation-delay: -0.32s; }
    .streaming-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }

    /* Input Area */
    .input-area {
      background: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 12px;
      padding-bottom: max(12px, env(safe-area-inset-bottom));
      flex-shrink: 0;
    }

    .quick-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
    }

    .quick-btn {
      padding: 8px 14px;
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 20px;
      color: var(--text-secondary);
      font-size: 0.85rem;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s;
    }
    .quick-btn:active {
      background: var(--border);
      transform: scale(0.95);
    }
    .quick-btn.danger {
      border-color: var(--error);
      color: var(--error);
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-wrapper {
      flex: 1;
      position: relative;
    }

    .command-input {
      width: 100%;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 12px 18px;
      padding-right: 48px;
      color: var(--text-primary);
      font-size: 16px;
      outline: none;
      resize: none;
      max-height: 120px;
      line-height: 1.4;
    }
    .command-input:focus { border-color: var(--accent); }
    .command-input::placeholder { color: var(--text-muted); }

    .voice-btn {
      position: absolute;
      right: 8px;
      bottom: 8px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .voice-btn.recording {
      background: var(--error);
      color: white;
      animation: pulse 1s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    .send-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: white;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      flex-shrink: 0;
    }
    .send-btn:active {
      background: var(--accent-dim);
      transform: scale(0.95);
    }
    .send-btn:disabled {
      background: var(--bg-tertiary);
      color: var(--text-muted);
    }

    /* Settings Panel */
    .settings-panel {
      position: fixed;
      top: 0;
      right: -300px;
      width: 280px;
      height: 100%;
      background: var(--bg-secondary);
      border-left: 1px solid var(--border);
      padding: 20px;
      padding-top: max(20px, env(safe-area-inset-top));
      transition: right 0.3s ease;
      z-index: 100;
      overflow-y: auto;
    }
    .settings-panel.open { right: 0; }

    .settings-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
      z-index: 99;
    }
    .settings-overlay.open { opacity: 1; pointer-events: auto; }

    .settings-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .settings-header h3 { font-size: 1.1rem; }

    .setting-group {
      margin-bottom: 20px;
    }

    .setting-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 8px;
    }

    .setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
    }

    .setting-row span { font-size: 0.95rem; }

    /* Toggle switch */
    .toggle {
      position: relative;
      width: 50px;
      height: 28px;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: var(--bg-tertiary);
      transition: 0.3s;
      border-radius: 28px;
      border: 1px solid var(--border);
    }

    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 2px;
      bottom: 2px;
      background-color: var(--text-secondary);
      transition: 0.3s;
      border-radius: 50%;
    }

    .toggle input:checked + .toggle-slider {
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .toggle input:checked + .toggle-slider:before {
      transform: translateX(22px);
      background-color: white;
    }

    select {
      background: var(--bg-tertiary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--text-primary);
      font-size: 0.9rem;
      width: 100%;
    }

    /* Form elements */
    input[type="password"],
    input[type="text"] {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      background: var(--bg-input);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-primary);
      outline: none;
      margin-bottom: 16px;
    }
    input:focus { border-color: var(--accent); }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
    }
    .btn-primary:active { background: var(--accent-dim); }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 120px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--bg-secondary);
      color: var(--text-primary);
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid var(--border);
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 1000;
      font-size: 0.9rem;
      max-width: 90%;
      text-align: center;
    }
    .toast.show { opacity: 1; }
    .toast.success { border-color: var(--success); }
    .toast.error { border-color: var(--error); }

    /* Empty state */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      padding: 40px 20px;
      text-align: center;
    }

    .empty-state .icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }

    .empty-state p {
      margin-bottom: 8px;
    }

    /* Command autocomplete */
    .autocomplete {
      position: absolute;
      bottom: 100%;
      left: 0;
      right: 0;
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 12px;
      margin-bottom: 8px;
      max-height: 200px;
      overflow-y: auto;
      display: none;
      z-index: 50;
    }
    .autocomplete.show { display: block; }

    .autocomplete-item {
      padding: 12px 16px;
      cursor: pointer;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .autocomplete-item:last-child { border-bottom: none; }
    .autocomplete-item:active { background: var(--bg-tertiary); }
    .autocomplete-item.selected { background: var(--bg-tertiary); }

    .autocomplete-item .cmd {
      color: var(--accent);
      font-family: 'SF Mono', monospace;
      font-size: 0.9rem;
    }
    .autocomplete-item .desc {
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    /* Prompt Card */
    .prompt-card {
      position: fixed;
      bottom: 180px;
      left: 12px;
      right: 12px;
      background: var(--bg-secondary);
      border: 2px solid var(--accent);
      border-radius: 16px;
      padding: 16px;
      display: none;
      z-index: 50;
      animation: slideUp 0.3s ease;
      max-height: min(70vh, 500px);
      overflow: hidden;
      flex-direction: column;
    }
    .prompt-card.show { display: flex; }
    .prompt-card.permission { border-color: var(--warning); }
    .prompt-card.destructive { border-color: var(--error); }

    @media (prefers-reduced-motion: reduce) {
      .prompt-card { animation: none; }
    }

    @media (orientation: landscape) and (max-height: 500px) {
      .prompt-card { max-height: 85vh; }
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .prompt-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .prompt-title {
      flex: 1;
      font-weight: 600;
    }

    .prompt-dismiss {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
    }

    .prompt-content {
      max-height: 250px;
      overflow-y: auto;
      margin-bottom: 12px;
      flex-shrink: 1;
    }

    .prompt-content p {
      margin: 0 0 8px 0;
      line-height: 1.4;
    }

    .prompt-command-preview {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      font-family: 'SF Mono', monospace;
      font-size: 0.85rem;
      margin: 8px 0;
      overflow-x: auto;
    }

    .prompt-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }

    .prompt-btn {
      flex: 1;
      min-width: 100px;
      min-height: 56px;
      padding: 16px 24px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: transform 0.1s, opacity 0.1s;
    }
    .prompt-btn:active {
      transform: scale(0.97);
    }
    .prompt-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .prompt-btn.primary {
      background: var(--success);
      color: white;
    }
    .prompt-btn.primary.destructive {
      background: var(--error);
    }

    .prompt-btn.secondary {
      background: var(--bg-tertiary);
      color: var(--text-primary);
      border: 1px solid var(--border);
    }

    .prompt-options-scroll {
      max-height: 300px;
      overflow-y: auto;
      margin-bottom: 12px;
    }

    .prompt-option {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px;
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 8px;
      cursor: pointer;
      min-height: 48px;
    }
    .prompt-option:focus {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .prompt-option.selected {
      border-color: var(--accent);
      background: rgba(88, 166, 255, 0.15);
    }

    .prompt-option input[type="radio"] {
      display: none;
    }
    .prompt-option::before {
      content: '';
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-radius: 50%;
      flex-shrink: 0;
    }
    .prompt-option.selected::before {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: inset 0 0 0 4px var(--bg-secondary);
    }

    .prompt-select {
      width: 100%;
      margin-bottom: 12px;
    }

    .prompt-input {
      width: 100%;
      background: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      color: var(--text-primary);
      font-size: 1rem;
      resize: none;
      margin-bottom: 12px;
    }
    .prompt-input:focus {
      border-color: var(--accent);
      outline: none;
    }

    .prompt-loading,
    .prompt-stale {
      display: none;
      text-align: center;
      padding: 8px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .prompt-card.loading .prompt-loading { display: block; }
    .prompt-card.loading .prompt-actions { opacity: 0.5; pointer-events: none; }
    .prompt-card.stale .prompt-stale { display: block; }

    .prompt-freeform {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
    }
    .prompt-freeform input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 14px;
    }
    .prompt-freeform button {
      padding: 8px 16px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <!-- Auth Screen -->
  <div class="auth-screen" id="authScreen">
    <div class="auth-box">
      <h2>⚡ Claude Remote</h2>
      <input type="password" id="token" placeholder="Enter auth token">
      <button class="btn btn-primary" onclick="connect()">Connect</button>
    </div>
  </div>

  <!-- Main App -->
  <div class="main-app" id="mainApp">
    <header class="header">
      <div class="header-left">
        <div class="status-dot" id="statusDot"></div>
        <select class="session-selector" id="sessionSelector" onchange="switchSession()">
          <option value="">Select session...</option>
        </select>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="refreshBtn" onclick="refreshSessions()" title="Refresh">🔄</button>
        <button class="icon-btn" id="ttsToggle" onclick="toggleTTS()" title="Text-to-speech">🔇</button>
        <button class="icon-btn" id="settingsBtn" onclick="openSettings()" title="Settings">⚙️</button>
      </div>
    </header>

    <div class="output-area" id="outputArea">
      <div class="empty-state" id="emptyState">
        <div class="icon">📡</div>
        <p>Select a session to monitor</p>
        <p style="font-size: 0.85rem;">Claude's responses will appear here in real-time</p>
      </div>
    </div>

    <!-- Prompt Card for Interactive Responses -->
    <div class="prompt-card" id="promptCard"
         role="alertdialog"
         aria-labelledby="promptTitle"
         aria-describedby="promptContent"
         aria-modal="true">
      <div class="prompt-header">
        <span class="prompt-icon" id="promptIcon">🔔</span>
        <span class="prompt-title" id="promptTitle">Claude needs input</span>
        <button class="prompt-dismiss" onclick="dismissPrompt()" aria-label="Respond later">✕</button>
      </div>
      <div class="prompt-content" id="promptContent"></div>
      <div class="prompt-actions" id="promptActions"></div>
      <div class="prompt-loading" id="promptLoading">Sending...</div>
      <div class="prompt-stale" id="promptStale">⚠️ Claude may have moved on</div>
    </div>

    <div class="input-area">
      <div class="quick-actions">
        <button class="quick-btn" onclick="sendPreset('/clear')">🧹 Clear</button>
        <button class="quick-btn" onclick="sendPreset('/compact')">📦 Compact</button>
        <button class="quick-btn" onclick="sendPreset('/status')">📊 Status</button>
        <button class="quick-btn" onclick="sendPreset('y')">✓ Yes</button>
        <button class="quick-btn danger" onclick="sendEscape()">⎋ Cancel</button>
      </div>
      <div class="input-row">
        <div class="input-wrapper">
          <div class="autocomplete" id="autocomplete"></div>
          <textarea class="command-input" id="commandInput" placeholder="Type a command..." rows="1" onkeydown="handleKeyDown(event)" oninput="handleInput(this)"></textarea>
          <button class="voice-btn" id="voiceBtn" onclick="toggleVoiceInput()">🎤</button>
        </div>
        <button class="send-btn" id="sendBtn" onclick="sendCommand()">➤</button>
      </div>
    </div>
  </div>

  <!-- Settings Panel -->
  <div class="settings-overlay" id="settingsOverlay" onclick="closeSettings()"></div>
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-header">
      <h3>Settings</h3>
      <button class="icon-btn" onclick="closeSettings()">✕</button>
    </div>

    <div class="setting-group">
      <label>Voice Output</label>
      <div class="setting-row">
        <span>Read responses aloud</span>
        <label class="toggle">
          <input type="checkbox" id="ttsEnabled" onchange="updateSettings()">
          <span class="toggle-slider"></span>
        </label>
      </div>
      <div class="setting-row">
        <span>Read tool calls</span>
        <label class="toggle">
          <input type="checkbox" id="speakTools" onchange="updateSettings()">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="setting-group">
      <label>Voice</label>
      <select id="voiceSelect" onchange="updateSettings()">
        <option value="default">System Default</option>
      </select>
    </div>

    <div class="setting-group">
      <label>Speech Rate</label>
      <select id="speechRate" onchange="updateSettings()">
        <option value="0.8">Slow</option>
        <option value="1" selected>Normal</option>
        <option value="1.2">Fast</option>
        <option value="1.5">Very Fast</option>
      </select>
    </div>

    <div class="setting-group">
      <label>Notifications</label>
      <div class="setting-row">
        <span>Notify on response</span>
        <label class="toggle">
          <input type="checkbox" id="notifyEnabled" onchange="updateSettings()">
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <div class="setting-group" style="margin-top: 40px;">
      <button class="btn btn-primary" onclick="disconnect()" style="background: var(--error);">Disconnect</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ============================================
    // State
    // ============================================
    let reconnectTimeout = null;
    let reconnectAttempts = 0;
    let pingTimeout = null;
    const MAX_RECONNECT_DELAY = 30000;
    let toastTimeout = null;
    let ws = null;
    let authToken = sessionStorage.getItem('claude_remote_token') || '';
    let currentSessionId = null;
    let isRecording = false;
    let recognition = null;
    let synth = window.speechSynthesis;
    let currentUtterance = null;
    let settings = {
      ttsEnabled: localStorage.getItem('tts_enabled') === 'true',
      speakTools: localStorage.getItem('speak_tools') === 'true',
      voiceURI: localStorage.getItem('voice_uri') || 'default',
      speechRate: parseFloat(localStorage.getItem('speech_rate')) || 1,
      notifyEnabled: localStorage.getItem('notify_enabled') === 'true'
    };
    const MAX_MESSAGES = 500;
    const recentUserMessages = []; // Track recently sent messages to dedupe

    // ============================================
    // WebSocket Send Helper
    // ============================================
    function wsSend(payload) {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        showToast('Not connected', 'error');
        return false;
      }
      try {
        ws.send(JSON.stringify(payload));
        return true;
      } catch (e) {
        showToast('Send failed', 'error');
        return false;
      }
    }

    // ============================================
    // Initialization
    // ============================================
    document.addEventListener('DOMContentLoaded', () => {
      if (authToken) {
        document.getElementById('token').value = authToken;
        connect();
      }

      initVoices();
      initSpeechRecognition();
      loadSettings();
      requestNotificationPermission();

      // Detect when user returns from background (iOS Safari frozen socket fix)
      document.addEventListener('visibilitychange', handleVisibilityChange);

      // Event delegation for tool expand/collapse (XSS-safe)
      document.getElementById('outputArea').addEventListener('click', (e) => {
        const summary = e.target.closest('.tool-summary');
        if (summary) {
          const lang = summary.dataset.lang || 'plaintext';
          toggleToolExpand(summary.parentElement, lang);
        }
      });

      // Event delegation for autocomplete selection (XSS-safe)
      document.getElementById('autocomplete').addEventListener('click', (e) => {
        const item = e.target.closest('.autocomplete-item');
        if (item && item.dataset.cmd) {
          selectAutocomplete(item.dataset.cmd);
        }
      });
    });

    function loadSettings() {
      document.getElementById('ttsEnabled').checked = settings.ttsEnabled;
      document.getElementById('speakTools').checked = settings.speakTools;
      document.getElementById('speechRate').value = settings.speechRate.toString();
      document.getElementById('notifyEnabled').checked = settings.notifyEnabled;
      updateTTSButton();
    }

    function initVoices() {
      const populateVoices = () => {
        const voices = synth.getVoices();
        const select = document.getElementById('voiceSelect');
        select.innerHTML = '<option value="default">System Default</option>';
        
        voices.forEach(voice => {
          const option = document.createElement('option');
          option.value = voice.voiceURI;
          option.textContent = `${voice.name} (${voice.lang})`;
          if (voice.voiceURI === settings.voiceURI) option.selected = true;
          select.appendChild(option);
        });
      };
      
      populateVoices();
      if (speechSynthesis.onvoiceschanged !== undefined) {
        speechSynthesis.onvoiceschanged = populateVoices;
      }
    }

    function initSpeechRecognition() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        document.getElementById('voiceBtn').style.display = 'none';
        return;
      }
      
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.lang = 'en-US';
      
      recognition.onresult = (event) => {
        const input = document.getElementById('commandInput');
        let finalTranscript = '';
        let interimTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; i++) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        // Check if this is a response to a prompt
        if (finalTranscript && currentPrompt && handleVoicePromptResponse(finalTranscript)) {
          return; // Handled as prompt response
        }

        input.value = finalTranscript || interimTranscript;
        autoResize(input);
      };
      
      recognition.onend = () => {
        isRecording = false;
        document.getElementById('voiceBtn').classList.remove('recording');
      };
      
      recognition.onerror = (event) => {
        console.error('Speech recognition error:', event.error);
        isRecording = false;
        document.getElementById('voiceBtn').classList.remove('recording');
        if (event.error !== 'no-speech') {
          showToast('Voice input error', 'error');
        }
      };
    }

    function requestNotificationPermission() {
      if ('Notification' in window && Notification.permission === 'default') {
        // Will request when user enables notifications in settings
      }
    }

    // ============================================
    // WebSocket Connection
    // ============================================

    // Shared WebSocket handler setup (DRY - used by connect and reconnect)
    function setupWebSocketHandlers(websocket, sessionToRewatch) {
      websocket.onopen = () => {
        // Authenticate via message instead of URL query (more secure)
        websocket.send(JSON.stringify({ action: 'auth', token: authToken }));
        // Save session for re-watching after auth succeeds
        if (sessionToRewatch) {
          window.pendingReconnectSession = sessionToRewatch;
        }
      };

      websocket.onclose = (event) => {
        const statusDot = document.getElementById('statusDot');
        statusDot.classList.remove('connected');

        if (event.code === 4001) {
          statusDot.classList.remove('reconnecting');
          showToast('Invalid token', 'error');
          disconnect();
          return;
        }

        // Schedule reconnect with exponential backoff
        if (authToken && !reconnectTimeout) {
          statusDot.classList.add('reconnecting');
          const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), MAX_RECONNECT_DELAY);
          showToast(`Disconnected - reconnecting in ${Math.round(delay/1000)}s...`, 'error');
          reconnectAttempts++;

          reconnectTimeout = setTimeout(() => {
            reconnectTimeout = null;
            reconnect();
          }, delay);
        } else {
          statusDot.classList.remove('reconnecting');
        }
      };

      websocket.onerror = () => {
        showToast('Connection error', 'error');
      };

      websocket.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        handleMessage(msg);
      };
    }

    function connect() {
      authToken = document.getElementById('token').value;
      if (!authToken) {
        showToast('Please enter a token', 'error');
        return;
      }

      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      // Connect without token in URL (security: prevents token in logs/history)
      const wsUrl = `${protocol}//${window.location.host}`;

      ws = new WebSocket(wsUrl);
      setupWebSocketHandlers(ws, null);
    }

    function disconnect() {
      if (reconnectTimeout) {
        clearTimeout(reconnectTimeout);
        reconnectTimeout = null;
      }
      if (pingTimeout) {
        clearTimeout(pingTimeout);
        pingTimeout = null;
      }
      sessionStorage.removeItem('claude_remote_token');
      authToken = '';
      if (ws) {
        ws.close();
        ws = null;
      }
      document.getElementById('mainApp').classList.remove('active');
      document.getElementById('authScreen').classList.remove('hidden');
      document.getElementById('token').value = '';
      closeSettings();
    }

    // ============================================
    // Reconnection Logic (iOS Safari frozen socket fix)
    // ============================================
    function handleVisibilityChange() {
      if (document.visibilityState === 'visible' && authToken) {
        checkConnectionHealth();
      }
    }

    function checkConnectionHealth() {
      if (!ws || ws.readyState !== WebSocket.OPEN) {
        if (!reconnectTimeout) reconnect();
        return;
      }

      // Send ping, expect pong within 3 seconds
      if (pingTimeout) clearTimeout(pingTimeout);
      pingTimeout = setTimeout(() => forceReconnect(), 3000);

      try {
        ws.send(JSON.stringify({ action: 'ping' }));
      } catch (e) {
        clearTimeout(pingTimeout);
        forceReconnect();
      }
    }

    function forceReconnect() {
      if (pingTimeout) clearTimeout(pingTimeout);
      pingTimeout = null;
      if (ws) {
        ws.onclose = null;
        ws.onerror = null;
        try { ws.close(); } catch (e) {}
        ws = null;
      }
      const statusDot = document.getElementById('statusDot');
      statusDot.classList.remove('connected');
      statusDot.classList.add('reconnecting');
      reconnect();
    }

    function reconnect() {
      if (reconnectTimeout) return;
      if (!authToken) return;

      const savedSessionId = currentSessionId;
      currentSessionId = null;

      const statusDot = document.getElementById('statusDot');
      statusDot.classList.remove('connected');
      statusDot.classList.add('reconnecting');
      showToast('Reconnecting...', 'error');

      // Create new connection (without token in URL for security)
      const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
      const wsUrl = `${protocol}//${window.location.host}`;
      ws = new WebSocket(wsUrl);
      setupWebSocketHandlers(ws, savedSessionId);
    }

    // ============================================
    // Message Handling
    // ============================================
    function handleMessage(msg) {
      switch (msg.type) {
        case 'auth_result':
          if (msg.success) {
            // Save token only after successful auth
            sessionStorage.setItem('claude_remote_token', authToken);
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.add('active');
            const statusDot = document.getElementById('statusDot');
            statusDot.classList.remove('reconnecting');
            statusDot.classList.add('connected');
            reconnectAttempts = 0;

            // Re-watch session if this was a reconnect
            if (window.pendingReconnectSession) {
              wsSend({ action: 'watch_session', sessionId: window.pendingReconnectSession });
              window.pendingReconnectSession = null;
              showToast('Reconnected!', 'success');
            } else {
              showToast('Connected!', 'success');
            }
          } else {
            showToast(msg.error || 'Authentication failed', 'error');
            disconnect();
          }
          break;

        case 'sessions':
          updateSessionList(msg.data);
          break;

        case 'watching':
          currentSessionId = msg.sessionId;
          break;
          
        case 'history':
          renderHistory(msg.data);
          break;
          
        case 'claude_output':
          if (msg.sessionId === currentSessionId) {
            // Handle structured AskUserQuestion prompts
            if (msg.data.type === 'ask_user_question') {
              showStructuredPrompt(msg.data.questions);
              break;
            }
            // Handle permission requests (Bash, Write, Edit, etc.)
            // Delay showing card - if tool_result comes quickly, it was auto-approved
            if (msg.data.type === 'permission_request') {
              const input = msg.data.input || {};
              const tool = msg.data.tool;
              const cmd = tool === 'Bash' ? (input.command || '') : `${tool}: ${input.file_path || 'unknown'}`;
              const isDestructive = tool === 'Bash' && /\brm\b|\bdelete\b|\bdrop\b/.test(cmd.toLowerCase());

              // Store pending card and wait 500ms before showing
              window.pendingPermissionCard = { tool, cmd, isDestructive };
              window.pendingPermissionTimeout = setTimeout(() => {
                if (window.pendingPermissionCard) {
                  window.lastPermissionCardTime = Date.now();
                  showPromptCard({
                    type: 'permission',
                    text: `Allow ${window.pendingPermissionCard.tool}?`,
                    command: window.pendingPermissionCard.cmd,
                    isDestructive: window.pendingPermissionCard.isDestructive
                  });
                  window.pendingPermissionCard = null;
                }
              }, 500);
              break;
            }
            // Cancel pending permission card on tool_result (command was auto-approved)
            if (msg.data.type === 'tool_result') {
              if (window.pendingPermissionTimeout) {
                clearTimeout(window.pendingPermissionTimeout);
                window.pendingPermissionTimeout = null;
                window.pendingPermissionCard = null;
              }
              // Dismiss existing permission card immediately
              if (currentPrompt?.type === 'permission') {
                hidePromptCard();
              }
            }
            // Dedupe user messages we just sent
            if (msg.data.type === 'user') {
              const content = typeof msg.data.content === 'string' ? msg.data.content : JSON.stringify(msg.data.content);
              const idx = recentUserMessages.indexOf(content);
              if (idx !== -1) {
                recentUserMessages.splice(idx, 1);
                break; // Skip this duplicate
              }
            }
            appendMessage(msg.data);
            
            // TTS for assistant messages
            if (msg.data.type === 'assistant' && settings.ttsEnabled) {
              speak(msg.data.content);
            }
            
            // TTS for tool calls (if enabled)
            if (msg.data.type === 'tool' && settings.speakTools) {
              speak(`Using tool: ${msg.data.tool}`);
            }
            
            // Notification
            if (msg.data.type === 'assistant' && settings.notifyEnabled && document.hidden) {
              sendNotification('Claude Response', msg.data.content.substring(0, 100));
            }
          }
          break;
          
        case 'session_status':
          updateSessionStatus(msg.sessionId, msg.status);
          // Auto-dismiss prompt if session became active (user responded elsewhere)
          if (msg.sessionId === currentSessionId && msg.status === 'processing' && currentPrompt) {
            hidePromptCard();
          }
          break;

        case 'inject_result':
          if (!msg.success) showToast('Failed to send', 'error');
          break;

        case 'error':
          showToast(msg.message, 'error');
          break;

        case 'pong':
          if (pingTimeout) clearTimeout(pingTimeout);
          break;
      }
    }

    function updateSessionList(sessions) {
      const selector = document.getElementById('sessionSelector');
      const currentValue = selector.value;
      selector.innerHTML = '<option value="">Select session...</option>';

      sessions.forEach(session => {
        const option = document.createElement('option');
        option.value = session.id;
        option.dataset.status = session.status;
        const icon = session.status === 'waiting' ? '🟠 ' :
                     session.status === 'processing' ? '🔵 ' : '';
        option.textContent = icon + session.name;
        selector.appendChild(option);
      });

      // Restore selection if still exists
      if (currentValue && sessions.find(s => s.id === currentValue)) {
        selector.value = currentValue;
      } else if (sessions.length === 1) {
        selector.value = sessions[0].id;
        switchSession();
      }
    }

    function updateSessionStatus(sessionId, status) {
      const selector = document.getElementById('sessionSelector');
      const option = selector.querySelector(`option[value="${sessionId}"]`);
      if (!option) return;

      const icon = status === 'waiting' ? '🟠 ' :
                   status === 'processing' ? '🔵 ' : '';
      const name = option.textContent.replace(/^[🟠🔵]\s*/, '');  // Strip old icon
      option.textContent = icon + name;
      option.dataset.status = status;
    }

    function switchSession() {
      const sessionId = document.getElementById('sessionSelector').value;
      if (!sessionId) return;

      document.getElementById('outputArea').innerHTML = '';

      wsSend({ action: 'watch_session', sessionId: sessionId });
    }

    function refreshSessions() {
      wsSend({ action: 'refresh_sessions' });
      showToast('Refreshed', 'success');
    }

    // ============================================
    // Output Rendering
    // ============================================
    function renderHistory(history) {
      const outputArea = document.getElementById('outputArea');
      outputArea.innerHTML = '';
      hidePromptCard(); // Clear any existing prompt

      history.forEach(entry => appendMessage(entry, false, true)); // skipPromptDetection=true
      outputArea.scrollTop = outputArea.scrollHeight;

      // Check if last history item needs a prompt (permission or question)
      if (history.length > 0) {
        const last = history[history.length - 1];
        if (last.type === 'ask_user_question' && last.questions) {
          showStructuredPrompt(last.questions);
        } else if (last.type === 'permission_request') {
          // Only show if session is waiting (not already executing)
          const sessionOption = document.querySelector(`#sessionSelector option[value="${currentSessionId}"]`);
          if (sessionOption?.dataset.status === 'waiting') {
            const input = last.input || {};
            const tool = last.tool;
            const cmd = tool === 'Bash' ? (input.command || '') : `${tool}: ${input.file_path || 'unknown'}`;
            const isDestructive = tool === 'Bash' && /\brm\b|\bdelete\b|\bdrop\b/.test(cmd.toLowerCase());
            window.lastPermissionCardTime = Date.now();
            showPromptCard({ type: 'permission', text: `Allow ${tool}?`, command: cmd, isDestructive });
          }
        }
      }
    }

    function appendMessage(data, scroll = true, skipPromptDetection = false) {
      const outputArea = document.getElementById('outputArea');
      document.getElementById('emptyState')?.remove();

      // Check for staleness of existing prompt
      if (!skipPromptDetection) checkPromptStaleness();

      // Remove oldest messages if over limit
      while (outputArea.children.length >= MAX_MESSAGES) {
        outputArea.removeChild(outputArea.firstChild);
      }

      const msg = document.createElement('div');
      msg.className = `message ${data.type}`;

      if (data.type === 'tool') {
        const toolInput = formatToolInput(data.input);
        // Guard against null/undefined input
        const fullInput = data.input == null
          ? ''
          : typeof data.input === 'string'
            ? data.input
            : JSON.stringify(data.input, null, 2);
        const lang = detectLanguage(data.input);
        msg.innerHTML = `
          <div class="tool-summary" data-lang="${escapeHtml(lang)}">
            <span class="tool-chevron">▶</span>
            <span class="tool-name">${escapeHtml(data.tool)}</span>
            <span style="color: var(--text-muted)">${escapeHtml(toolInput.substring(0, 50))}${toolInput.length > 50 ? '...' : ''}</span>
          </div>
          <div class="tool-details"><pre>${escapeHtml(fullInput)}</pre></div>
        `;
      } else if (data.type === 'tool_result') {
        const result = typeof data.result === 'string' ? data.result : JSON.stringify(data.result, null, 2);
        // Split once, reuse for preview and line count
        const lines = result.split('\n');
        const preview = lines[0].substring(0, 50);
        const lineCount = lines.length;
        // Show ellipsis if first line truncated OR multiple lines exist
        const needsEllipsis = lines[0].length > 50 || lineCount > 1;
        // Try to detect language from previous tool call's file path
        const lang = window.lastToolLanguage || 'plaintext';
        msg.innerHTML = `
          <div class="tool-summary" data-lang="${escapeHtml(lang)}">
            <span class="tool-chevron">▶</span>
            <span style="color: var(--text-muted)">Result: ${escapeHtml(preview)}${needsEllipsis ? '...' : ''} (${lineCount} lines)</span>
          </div>
          <div class="tool-details"><pre>${escapeHtml(result)}</pre></div>
        `;
      } else {
        const content = typeof data.content === 'string'
          ? data.content
          : JSON.stringify(data.content);
        msg.innerHTML = `<pre>${escapeHtml(content)}</pre>`;
      }

      outputArea.appendChild(msg);

      if (scroll) {
        outputArea.scrollTop = outputArea.scrollHeight;
      }

      // Check if this is a new prompt from assistant
      if (data.type === 'assistant' && !skipPromptDetection) {
        const content = typeof data.content === 'string' ? data.content : JSON.stringify(data.content);
        const prompt = detectPromptType(content);
        if (prompt) {
          showPromptCard(prompt);
        }
      }

      return msg;
    }

    function formatToolInput(input) {
      if (typeof input === 'string') return input;
      if (input.command) return input.command;
      if (input.content) return input.content.substring(0, 200) + (input.content.length > 200 ? '...' : '');
      if (input.path) return input.path;
      return JSON.stringify(input, null, 2).substring(0, 200);
    }

    // Toggle tool expand with syntax highlighting
    function toggleToolExpand(element, language) {
      const wasExpanded = element.classList.contains('expanded');
      element.classList.toggle('expanded');

      // Apply syntax highlighting on first expand
      if (!wasExpanded && language && language !== 'plaintext') {
        const pre = element.querySelector('.tool-details pre');
        if (pre && !pre.classList.contains('highlighted')) {
          loadPrism().then(() => {
            highlightCode(pre, language);
            pre.classList.add('highlighted');
          });
        }
      }

      // Track language for tool_result pairing
      window.lastToolLanguage = language;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ============================================
    // Command Sending
    // ============================================
    function sendCommand() {
      const input = document.getElementById('commandInput');
      const sendBtn = document.getElementById('sendBtn');
      const command = input.value.trim();

      if (!command || sendBtn.disabled) return;

      sendBtn.disabled = true;

      if (!wsSend({ action: 'inject', command: command })) {
        sendBtn.disabled = false;
        return;
      }

      recentUserMessages.push(command);
      if (recentUserMessages.length > 10) recentUserMessages.shift();
      appendMessage({ type: 'user', content: command });

      input.value = '';
      autoResize(input);
      showToast('Sent!', 'success');

      // Re-enable after a short delay to prevent accidental double-sends
      setTimeout(() => sendBtn.disabled = false, 300);
    }

    function sendPreset(cmd) {
      wsSend({ action: 'inject', command: cmd });
      recentUserMessages.push(cmd);
      if (recentUserMessages.length > 10) recentUserMessages.shift();
      appendMessage({ type: 'user', content: cmd });
      showToast('Sent!', 'success');
    }

    function sendEscape() {
      wsSend({ action: 'escape' });
      showToast('Cancelled', 'success');
    }

    function handleKeyDown(event) {
      const autocomplete = document.getElementById('autocomplete');
      const isVisible = autocomplete.classList.contains('show');

      if (isVisible) {
        if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
          event.preventDefault();
          navigateAutocomplete(event.key === 'ArrowDown' ? 1 : -1);
          return;
        }
        if (event.key === 'Tab' || (event.key === 'Enter' && !event.shiftKey)) {
          const selected = autocomplete.querySelector('.selected');
          if (selected) {
            event.preventDefault();
            selectAutocomplete(selected.dataset.cmd);
            return;
          }
        }
        if (event.key === 'Escape') {
          hideAutocomplete();
          return;
        }
      }

      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        sendCommand();
      }
    }

    function autoResize(el) {
      el.style.height = 'auto';
      el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    // ============================================
    // Command Autocomplete
    // ============================================
    const COMMANDS = [
      { cmd: '/workflows:plan', desc: 'Create implementation plan' },
      { cmd: '/workflows:work', desc: 'Execute a plan' },
      { cmd: '/workflows:review', desc: 'Code review with agents' },
      { cmd: '/workflows:brainstorm', desc: 'Explore approaches' },
      { cmd: '/commit', desc: 'Commit changes' },
      { cmd: '/commit-and-pr', desc: 'Commit and create PR' },
      { cmd: '/clear', desc: 'Clear conversation' },
      { cmd: '/compact', desc: 'Compact context' },
      { cmd: '/status', desc: 'Show status' },
      { cmd: '/help', desc: 'Show help' },
      { cmd: '/explore', desc: 'Explore codebase' },
      { cmd: '/security-review', desc: 'Security checklist' },
      { cmd: '/generate-tests', desc: 'Generate tests' },
      { cmd: '/fresh-eyes-review', desc: 'Unbiased code review' },
      { cmd: '/refactor', desc: 'Guided refactoring' },
    ];

    let autocompleteIndex = -1;

    function handleInput(el) {
      autoResize(el);
      const value = el.value;

      if (value.startsWith('/')) {
        const query = value.toLowerCase();
        const matches = COMMANDS.filter(c => c.cmd.toLowerCase().includes(query));
        if (matches.length > 0) {
          showAutocomplete(matches);
        } else {
          hideAutocomplete();
        }
      } else {
        hideAutocomplete();
      }
    }

    function showAutocomplete(matches) {
      const autocomplete = document.getElementById('autocomplete');
      autocompleteIndex = -1;
      autocomplete.innerHTML = matches.map((m, i) => `
        <div class="autocomplete-item" data-cmd="${escapeHtml(m.cmd)}">
          <span class="cmd">${escapeHtml(m.cmd)}</span>
          <span class="desc">${escapeHtml(m.desc)}</span>
        </div>
      `).join('');
      autocomplete.classList.add('show');
    }

    function hideAutocomplete() {
      document.getElementById('autocomplete').classList.remove('show');
      autocompleteIndex = -1;
    }

    function navigateAutocomplete(direction) {
      const items = document.querySelectorAll('.autocomplete-item');
      if (items.length === 0) return;

      items.forEach(item => item.classList.remove('selected'));
      autocompleteIndex += direction;

      if (autocompleteIndex < 0) autocompleteIndex = items.length - 1;
      if (autocompleteIndex >= items.length) autocompleteIndex = 0;

      items[autocompleteIndex].classList.add('selected');
      items[autocompleteIndex].scrollIntoView({ block: 'nearest' });
    }

    function selectAutocomplete(cmd) {
      const input = document.getElementById('commandInput');
      input.value = cmd + ' ';
      input.focus();
      hideAutocomplete();
      autoResize(input);
    }

    // ============================================
    // Text-to-Speech
    // ============================================
    function speak(text) {
      if (!settings.ttsEnabled || !synth) return;
      
      // Stop any current speech
      synth.cancel();
      
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = settings.speechRate;
      
      // Find selected voice
      if (settings.voiceURI !== 'default') {
        const voices = synth.getVoices();
        const voice = voices.find(v => v.voiceURI === settings.voiceURI);
        if (voice) utterance.voice = voice;
      }
      
      // Highlight message being spoken
      const messages = document.querySelectorAll('.message.assistant');
      const lastMsg = messages[messages.length - 1];
      if (lastMsg) lastMsg.classList.add('speaking');
      
      utterance.onend = () => {
        if (lastMsg) lastMsg.classList.remove('speaking');
      };
      
      synth.speak(utterance);
      currentUtterance = utterance;
    }

    function toggleTTS() {
      settings.ttsEnabled = !settings.ttsEnabled;
      localStorage.setItem('tts_enabled', settings.ttsEnabled);
      document.getElementById('ttsEnabled').checked = settings.ttsEnabled;
      updateTTSButton();
      
      if (!settings.ttsEnabled) {
        synth.cancel();
      }
      
      showToast(settings.ttsEnabled ? 'TTS enabled' : 'TTS disabled', 'success');
    }

    function updateTTSButton() {
      const btn = document.getElementById('ttsToggle');
      btn.textContent = settings.ttsEnabled ? '🔊' : '🔇';
      btn.classList.toggle('active', settings.ttsEnabled);
    }

    // ============================================
    // Voice Input
    // ============================================
    function toggleVoiceInput() {
      if (!recognition) {
        showToast('Voice input not supported', 'error');
        return;
      }
      
      if (isRecording) {
        recognition.stop();
      } else {
        recognition.start();
        isRecording = true;
        document.getElementById('voiceBtn').classList.add('recording');
      }
    }

    // ============================================
    // Notifications
    // ============================================
    function sendNotification(title, body) {
      if (!('Notification' in window)) return;
      
      if (Notification.permission === 'granted') {
        new Notification(title, { body, icon: '⚡' });
      } else if (Notification.permission !== 'denied') {
        Notification.requestPermission().then(permission => {
          if (permission === 'granted') {
            new Notification(title, { body });
          }
        });
      }
    }

    // ============================================
    // Settings
    // ============================================
    function openSettings() {
      document.getElementById('settingsPanel').classList.add('open');
      document.getElementById('settingsOverlay').classList.add('open');
    }

    function closeSettings() {
      document.getElementById('settingsPanel').classList.remove('open');
      document.getElementById('settingsOverlay').classList.remove('open');
    }

    function updateSettings() {
      settings.ttsEnabled = document.getElementById('ttsEnabled').checked;
      settings.speakTools = document.getElementById('speakTools').checked;
      settings.voiceURI = document.getElementById('voiceSelect').value;
      settings.speechRate = parseFloat(document.getElementById('speechRate').value);
      settings.notifyEnabled = document.getElementById('notifyEnabled').checked;
      
      localStorage.setItem('tts_enabled', settings.ttsEnabled);
      localStorage.setItem('speak_tools', settings.speakTools);
      localStorage.setItem('voice_uri', settings.voiceURI);
      localStorage.setItem('speech_rate', settings.speechRate);
      localStorage.setItem('notify_enabled', settings.notifyEnabled);
      
      updateTTSButton();
      
      // Request notification permission if enabling
      if (settings.notifyEnabled && 'Notification' in window && Notification.permission === 'default') {
        Notification.requestPermission();
      }
    }

    // ============================================
    // Utilities
    // ============================================
    function showToast(message, type = '') {
      if (toastTimeout) {
        clearTimeout(toastTimeout);
        toastTimeout = null;
      }
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast show ${type}`;
      toastTimeout = setTimeout(() => {
        toast.className = 'toast';
        toastTimeout = null;
      }, 2500);
    }

    // ============================================
    // Interactive Prompt Response UI
    // ============================================
    const PROMPT_STYLES = {
      permission: { icon: '⚠️', title: 'Permission Required', className: 'permission' },
      yesNo: { icon: '❓', title: 'Question', className: '' },
      multiChoice: { icon: '📋', title: 'Pick an option', className: '' },
      freeForm: { icon: '✏️', title: 'Your input needed', className: '' }
    };

    const DESTRUCTIVE_KEYWORDS = ['delete', 'remove', 'drop', 'destroy', 'reset', 'force', 'overwrite', 'erase'];

    let currentPrompt = null;
    let promptMessageIndex = 0;

    function isDestructivePrompt(text) {
      const lower = text.toLowerCase();
      return DESTRUCTIVE_KEYWORDS.some(k => lower.includes(k));
    }

    function detectPromptType(content) {
      // Only check last portion of message to avoid false positives
      const lines = content.split('\n').filter(l => l.trim());
      const lastPortion = lines.slice(-5).join('\n'); // Last 5 lines
      const lastLine = lines[lines.length - 1] || content;

      // Must end with a question or have explicit prompt markers
      const hasQuestion = /\?\s*$/.test(lastLine.trim());
      const hasExplicitMarker = /\(y\/n\)|\[y\/n\]|\[yes\/no\]/i.test(lastPortion);

      if (!hasQuestion && !hasExplicitMarker) return null;

      // Permission prompts
      if (/\(y\/n\)|\[y\/n\]|run this command|allow this|approve|execute/i.test(lastPortion)) {
        // Try to extract the command being requested
        const commandMatch = content.match(/`([^`]+)`|"([^"]+)"|run[:\s]+(.+?)(?:\?|$)/i);
        const command = commandMatch ? (commandMatch[1] || commandMatch[2] || commandMatch[3]) : null;
        return { type: 'permission', text: content, command, isDestructive: isDestructivePrompt(content) };
      }

      // Multiple choice - look for numbered/lettered options with a question
      const options = [];
      const optionPatterns = [
        /^(\d+)[.)]\s+(.+)$/gm,
        /^([A-D])[.)]\s+(.+)$/gim,
      ];
      for (const pattern of optionPatterns) {
        const matches = content.matchAll(pattern);
        for (const match of matches) {
          const optText = match[2].replace(/\*\*/g, '').trim();
          if (optText.length > 0) {
            options.push({ num: match[1], text: optText });
          }
        }
      }
      if (options.length >= 2 && hasQuestion) {
        return { type: 'multiChoice', options, text: content };
      }

      // Yes/No explicit
      if (/yes or no|\(yes\/no\)|should I|want me to|shall I|do you want/i.test(lastPortion) && hasQuestion) {
        return { type: 'yesNo', text: content, isDestructive: isDestructivePrompt(content) };
      }

      // Free-form feedback request
      if (/what would you like|please describe|tell me more|any feedback|your thoughts/i.test(lastPortion)) {
        return { type: 'freeForm', text: content };
      }

      return null;
    }

    function showStructuredPrompt(questions) {
      // Defensive checks
      if (!Array.isArray(questions) || questions.length === 0) return;
      const q = questions[0];
      if (!q.question || !Array.isArray(q.options)) return;

      const prompt = {
        type: 'multiChoice',
        text: q.question,
        options: q.options.map((opt, i) => ({
          num: (i + 1).toString(),
          text: opt.description ? `${opt.label}: ${opt.description}` : opt.label
        }))
      };
      showPromptCard(prompt);
    }

    function showPromptCard(prompt) {
      const card = document.getElementById('promptCard');
      const content = document.getElementById('promptContent');
      const actions = document.getElementById('promptActions');
      const icon = document.getElementById('promptIcon');
      const title = document.getElementById('promptTitle');

      currentPrompt = prompt;
      promptMessageIndex = document.querySelectorAll('.message').length;

      // Apply styling based on prompt type
      const style = PROMPT_STYLES[prompt.type];
      card.className = 'prompt-card show ' + style.className;
      if (prompt.isDestructive) card.classList.add('destructive');
      icon.textContent = style.icon;
      title.textContent = style.title;

      // Extract the question (last meaningful line)
      const lines = prompt.text.split('\n').filter(l => l.trim());
      const question = lines.find(l => /\?/.test(l)) || lines[lines.length - 1] || prompt.text;

      switch (prompt.type) {
        case 'permission':
          content.innerHTML = `<p>${escapeHtml(question)}</p>`;
          if (prompt.command) {
            content.innerHTML += `<div class="prompt-command-preview"><code>${escapeHtml(prompt.command)}</code></div>`;
          }
          const yesClass = prompt.isDestructive ? 'secondary' : 'primary';
          const noClass = prompt.isDestructive ? 'primary destructive' : 'secondary';
          actions.innerHTML = `
            <button class="prompt-btn ${yesClass}" onclick="respondToPrompt('y')">Yes</button>
            <button class="prompt-btn ${noClass}" onclick="respondToPrompt('n')">No</button>
          `;
          break;

        case 'yesNo':
          content.innerHTML = `<p>${escapeHtml(question)}</p>`;
          const yesClass2 = prompt.isDestructive ? 'secondary' : 'primary';
          const noClass2 = prompt.isDestructive ? 'primary destructive' : 'secondary';
          actions.innerHTML = `
            <button class="prompt-btn ${yesClass2}" onclick="respondToPrompt('y')">Yes</button>
            <button class="prompt-btn ${noClass2}" onclick="respondToPrompt('n')">No</button>
          `;
          break;

        case 'multiChoice':
          content.innerHTML = `<p>${escapeHtml(question)}</p>`;
          const useDropdown = prompt.options.length > 5;
          if (useDropdown) {
            content.innerHTML += `
              <select class="prompt-select" id="promptSelect">
                <option value="">Select an option...</option>
                ${prompt.options.map(opt => `<option value="${opt.num}">${escapeHtml(opt.num)}. ${escapeHtml(opt.text)}</option>`).join('')}
              </select>
            `;
            actions.innerHTML = `<button class="prompt-btn primary" onclick="submitDropdownChoice()">Select</button>`;
          } else {
            content.innerHTML += `<div class="prompt-options-scroll">
              ${prompt.options.map((opt, i) => `
                <div class="prompt-option" data-value="${opt.num}" onclick="selectOption(this)" tabindex="0" role="radio" aria-checked="false">
                  <span>${escapeHtml(opt.num)}. ${escapeHtml(opt.text)}</span>
                </div>
              `).join('')}
            </div>`;
            actions.innerHTML = `<button class="prompt-btn primary" onclick="submitChoice()">Select</button>`;
          }
          break;

        case 'freeForm':
          content.innerHTML = `
            <p>${escapeHtml(question)}</p>
            <textarea class="prompt-input" id="promptInput" placeholder="Type your response..." rows="2"></textarea>
          `;
          actions.innerHTML = `<button class="prompt-btn primary" onclick="submitFreeform()">Send</button>`;
          setTimeout(() => document.getElementById('promptInput')?.focus(), 100);
          break;
      }

      // Add freeform input to all prompt types except freeForm (which already has one)
      if (prompt.type !== 'freeForm') {
        content.innerHTML += `
          <div class="prompt-freeform">
            <input type="text" id="promptFreeformInput" placeholder="Or type a custom response..."
                   onkeydown="if(event.key==='Enter')respondToPromptFreeform()">
            <button onclick="respondToPromptFreeform()">Send</button>
          </div>
        `;
      }

      card.classList.remove('loading', 'stale');

      // Focus first interactive element for accessibility
      setTimeout(() => {
        const firstInteractive = card.querySelector('button, input, textarea, select, .prompt-option');
        firstInteractive?.focus();
      }, 100);

      // Voice: read the prompt, then listen
      if (settings.ttsEnabled) {
        speakThenListen(`Claude is asking: ${question}`);
      }

      // Setup keyboard navigation for options
      setupOptionKeyboardNav();
    }

    function setupOptionKeyboardNav() {
      const card = document.getElementById('promptCard');
      card.onkeydown = (e) => {
        const options = [...card.querySelectorAll('.prompt-option')];
        if (options.length === 0) return;

        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          const current = options.findIndex(o => o.classList.contains('selected'));
          let next;
          if (e.key === 'ArrowDown') {
            next = current < 0 ? 0 : (current + 1) % options.length;
          } else {
            next = current < 0 ? options.length - 1 : (current - 1 + options.length) % options.length;
          }
          selectOption(options[next]);
          options[next].focus();
        } else if (e.key === 'Enter' && document.activeElement?.classList.contains('prompt-option')) {
          e.preventDefault();
          submitChoice();
        }
      };
    }

    function respondToPrompt(response) {
      const card = document.getElementById('promptCard');
      card.classList.add('loading');

      // Haptic feedback
      navigator.vibrate?.(50);

      // Send response
      const success = wsSend({ action: 'inject', command: response });

      if (success) {
        recentUserMessages.push(response);
        if (recentUserMessages.length > 10) recentUserMessages.shift();
        appendMessage({ type: 'user', content: response });
        if (settings.ttsEnabled) {
          speak(`Sent: ${response}`);
        }
        setTimeout(() => hidePromptCard(), 300);
      } else {
        card.classList.remove('loading');
        showToast('Failed to send response', 'error');
      }
    }

    function respondToPromptFreeform() {
      const input = document.getElementById('promptFreeformInput');
      const text = input?.value?.trim();
      if (text) {
        respondToPrompt(text);
      }
    }

    function selectOption(el) {
      document.querySelectorAll('.prompt-option').forEach(o => {
        o.classList.remove('selected');
        o.setAttribute('aria-checked', 'false');
      });
      el.classList.add('selected');
      el.setAttribute('aria-checked', 'true');
    }

    function submitChoice() {
      const selected = document.querySelector('.prompt-option.selected');
      if (selected) {
        respondToPrompt(selected.dataset.value);
      } else {
        showToast('Please select an option', 'error');
      }
    }

    function submitDropdownChoice() {
      const select = document.getElementById('promptSelect');
      if (select?.value) {
        respondToPrompt(select.value);
      } else {
        showToast('Please select an option', 'error');
      }
    }

    function submitFreeform() {
      const input = document.getElementById('promptInput');
      if (input?.value.trim()) {
        respondToPrompt(input.value.trim());
      } else {
        showToast('Please enter a response', 'error');
      }
    }

    function hidePromptCard() {
      const card = document.getElementById('promptCard');
      card.classList.remove('show', 'loading', 'stale');
      currentPrompt = null;
    }

    function dismissPrompt() {
      hidePromptCard();
      showToast('You can still respond in the text input', 'info');
    }

    function checkPromptStaleness() {
      if (!currentPrompt) return;
      const currentCount = document.querySelectorAll('.message').length;
      if (currentCount > promptMessageIndex + 2) {
        document.getElementById('promptCard').classList.add('stale');
      }
    }

    // Voice integration for prompts
    function speakThenListen(text) {
      if (!settings.ttsEnabled || !synth) return;

      // Stop any current listening
      if (recognition && isRecording) {
        recognition.stop();
        isRecording = false;
      }

      synth.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = settings.speechRate;

      if (settings.voiceURI !== 'default') {
        const voices = synth.getVoices();
        const voice = voices.find(v => v.voiceURI === settings.voiceURI);
        if (voice) utterance.voice = voice;
      }

      utterance.onend = () => {
        // Wait 500ms then start listening for response
        setTimeout(() => {
          if (currentPrompt && recognition) {
            startListeningForPromptResponse();
          }
        }, 500);
      };

      synth.speak(utterance);
    }

    function startListeningForPromptResponse() {
      if (!recognition || isRecording) return;

      recognition.start();
      isRecording = true;
      document.getElementById('voiceBtn')?.classList.add('recording');
    }

    function handleVoicePromptResponse(transcript) {
      if (!currentPrompt) return false;

      const text = transcript.toLowerCase().trim();

      // Yes responses
      if (['yes', 'yeah', 'yep', 'okay', 'ok', 'proceed', 'sure', 'go ahead', 'do it'].includes(text)) {
        respondToPrompt('y');
        return true;
      }

      // No responses
      if (['no', 'nope', 'cancel', 'stop', "don't", 'abort', 'negative'].includes(text)) {
        respondToPrompt('n');
        return true;
      }

      // Option selection (for multi-choice)
      if (currentPrompt.type === 'multiChoice') {
        const optionMatch = text.match(/^(?:option\s+)?(\d+|one|two|three|four|five|first|second|third|fourth|fifth)$/i);
        if (optionMatch) {
          const numMap = { one: '1', two: '2', three: '3', four: '4', five: '5', first: '1', second: '2', third: '3', fourth: '4', fifth: '5' };
          const num = numMap[optionMatch[1].toLowerCase()] || optionMatch[1];
          respondToPrompt(num);
          return true;
        }
      }

      // Free-form: use the transcript as-is
      if (currentPrompt.type === 'freeForm') {
        respondToPrompt(transcript);
        return true;
      }

      return false;
    }

    // Viewport handling for keyboard
    function setupViewportHandling() {
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', adjustPromptCardPosition);
      }
    }

    function adjustPromptCardPosition() {
      const card = document.getElementById('promptCard');
      if (!card.classList.contains('show')) return;

      const viewport = window.visualViewport;
      if (viewport) {
        const keyboardHeight = window.innerHeight - viewport.height;
        if (keyboardHeight > 100) {
          // Keyboard is visible
          card.style.bottom = (keyboardHeight + 10) + 'px';
        } else {
          card.style.bottom = '180px';
        }
      }
    }

    // Initialize viewport handling
    document.addEventListener('DOMContentLoaded', setupViewportHandling);

    // ============================================
    // Syntax Highlighting (Prism.js)
    // ============================================
    let prismLoaded = false;

    // SRI hashes for Prism.js CDN resources (security)
    const PRISM_SRI = {
      core: 'sha512-5BmBkPa0dCoqHc1APXLQjZhyRw6sl0RQDF1LvvqNGprNGOt8YLhTwP/RaG/mHDfSPMC7f7O+GQGHJLw+b+Kw6A==',
      // Language components use CDN versioning for integrity
    };

    function loadPrism() {
      if (prismLoaded) return Promise.resolve();
      return new Promise((resolve) => {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js';
        script.integrity = PRISM_SRI.core;
        script.crossOrigin = 'anonymous';
        script.onload = () => {
          // Load common language components
          const languages = ['javascript', 'typescript', 'python', 'bash', 'json', 'ruby', 'css', 'markup'];
          let loaded = 0;
          languages.forEach(lang => {
            const langScript = document.createElement('script');
            langScript.src = `https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-${lang}.min.js`;
            langScript.crossOrigin = 'anonymous';
            langScript.onload = () => { if (++loaded === languages.length) { prismLoaded = true; resolve(); } };
            langScript.onerror = () => { if (++loaded === languages.length) { prismLoaded = true; resolve(); } };
            document.head.appendChild(langScript);
          });
        };
        script.onerror = resolve; // Graceful fallback if CDN fails
        document.head.appendChild(script);
      });
    }

    function detectLanguage(toolInput) {
      if (!toolInput) return 'plaintext';
      const filePath = toolInput.file_path || toolInput.path || '';
      const ext = filePath.split('.').pop()?.toLowerCase();
      const map = {
        js: 'javascript', jsx: 'javascript', mjs: 'javascript',
        ts: 'typescript', tsx: 'typescript',
        py: 'python',
        rb: 'ruby',
        sh: 'bash', bash: 'bash', zsh: 'bash',
        json: 'json',
        css: 'css', scss: 'css',
        html: 'markup', htm: 'markup', xml: 'markup', svg: 'markup',
        md: 'markdown'
      };
      return map[ext] || 'plaintext';
    }

    function highlightCode(preElement, language) {
      if (!prismLoaded || !window.Prism) return;
      const code = preElement.textContent;
      const lines = code.split('\n').length;
      // Skip highlighting for very large outputs (performance)
      if (lines > 500) return;

      try {
        const grammar = Prism.languages[language] || Prism.languages.plaintext;
        if (grammar) {
          preElement.innerHTML = Prism.highlight(code, grammar, language);
          preElement.classList.add(`language-${language}`);
        }
      } catch (e) {
        // Silently fail - plain text is fine
      }
    }
  </script>
