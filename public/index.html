    // ============================================
    // Interactive Prompt Response UI
    // ============================================
    const PROMPT_STYLES = {
      permission: { icon: '⚠️', title: 'Permission Required', className: 'permission' },
      yesNo: { icon: '❓', title: 'Question', className: '' },
      multiChoice: { icon: '📋', title: 'Pick an option', className: '' },
      freeForm: { icon: '✏️', title: 'Your input needed', className: '' }
    };

    const DESTRUCTIVE_KEYWORDS = ['delete', 'remove', 'drop', 'destroy', 'reset', 'force', 'overwrite', 'erase'];

    let currentPrompt = null;
    let promptMessageIndex = 0;

    function isDestructivePrompt(text) {
      const lower = text.toLowerCase();
      return DESTRUCTIVE_KEYWORDS.some(k => lower.includes(k));
    }

    function detectPromptType(content) {
      // Only check last portion of message to avoid false positives
      const lines = content.split('\n').filter(l => l.trim());
      const lastPortion = lines.slice(-5).join('\n'); // Last 5 lines
      const lastLine = lines[lines.length - 1] || content;

      // Must end with a question or have explicit prompt markers
      const hasQuestion = /\?\s*$/.test(lastLine.trim());
      const hasExplicitMarker = /\(y\/n\)|\[y\/n\]|\[yes\/no\]/i.test(lastPortion);

      if (!hasQuestion && !hasExplicitMarker) return null;

      // Permission prompts
      if (/\(y\/n\)|\[y\/n\]|run this command|allow this|approve|execute/i.test(lastPortion)) {
        // Try to extract the command being requested
        const commandMatch = content.match(/`([^`]+)`|"([^"]+)"|run[:\s]+(.+?)(?:\?|$)/i);
        const command = commandMatch ? (commandMatch[1] || commandMatch[2] || commandMatch[3]) : null;
        return { type: 'permission', text: content, command, isDestructive: isDestructivePrompt(content) };
      }

      // Multiple choice - look for numbered/lettered options with a question
      const options = [];
      const optionPatterns = [
        /^(\d+)[.)]\s+(.+)$/gm,
        /^([A-D])[.)]\s+(.+)$/gim,
      ];
      for (const pattern of optionPatterns) {
        const matches = content.matchAll(pattern);
        for (const match of matches) {
          const optText = match[2].replace(/\*\*/g, '').trim();
          if (optText.length > 0) {
            options.push({ num: match[1], text: optText });
          }
        }
      }
      if (options.length >= 2 && hasQuestion) {
        return { type: 'multiChoice', options, text: content };
      }

      // Yes/No explicit
      if (/yes or no|\(yes\/no\)|should I|want me to|shall I|do you want/i.test(lastPortion) && hasQuestion) {
        return { type: 'yesNo', text: content, isDestructive: isDestructivePrompt(content) };
      }

      // Free-form feedback request
      if (/what would you like|please describe|tell me more|any feedback|your thoughts/i.test(lastPortion)) {
        return { type: 'freeForm', text: content };
      }

      return null;
    }

    function showStructuredPrompt(questions, subagentId = null) {
      // Defensive checks
      if (!Array.isArray(questions) || questions.length === 0) return;
      const q = questions[0];
      if (!q.question || !Array.isArray(q.options)) return;

      const prompt = {
        type: 'multiChoice',
        text: q.question,
        multiSelect: q.multiSelect === true,  // Pass through multi-select flag
        subagentId: subagentId,               // Track which subagent needs response
        options: q.options.map((opt, i) => ({
          num: (i + 1).toString(),
          text: opt.description ? `${opt.label}: ${opt.description}` : opt.label
        }))
      };
      showPromptCard(prompt);
    }

    function showPromptCard(prompt) {
      const card = document.getElementById('promptCard');
      const content = document.getElementById('promptContent');
      const actions = document.getElementById('promptActions');
      const icon = document.getElementById('promptIcon');
      const title = document.getElementById('promptTitle');

      currentPrompt = prompt;
      promptMessageIndex = document.querySelectorAll('.message').length;

      // Apply styling based on prompt type
      const style = PROMPT_STYLES[prompt.type];
      card.className = 'prompt-card show ' + style.className;
      if (prompt.isDestructive) card.classList.add('destructive');
      icon.textContent = style.icon;
      title.textContent = style.title;

      // Extract the question (last meaningful line)
      const lines = prompt.text.split('\n').filter(l => l.trim());
      const question = lines.find(l => /\?/.test(l)) || lines[lines.length - 1] || prompt.text;

      switch (prompt.type) {
        case 'permission':
          let permissionHtml = '';
          if (prompt.subagentId) {
            permissionHtml += `<div class="subagent-context">🤖 Subagent: ${prompt.subagentId.substring(0, 7)}</div>`;
          }
          permissionHtml += `<p>${escapeHtml(question)}</p>`;
          if (prompt.command) {
            permissionHtml += `<div class="prompt-command-preview"><code>${escapeHtml(formatPermissionDisplay(prompt.tool, prompt.command))}</code></div>`;
          }
          content.innerHTML = permissionHtml;
          // Claude Code uses numbered options: 1=Yes (once), 2=Yes and always allow, 3=No
          actions.innerHTML = `
            <button class="prompt-btn ${prompt.isDestructive ? 'secondary' : 'primary'}" onclick="respondToPrompt('1')">Yes</button>
            <button class="prompt-btn allow-always" onclick="respondToPermission('2', '${prompt.tool || ''}')">Always Allow</button>
            <button class="prompt-btn ${prompt.isDestructive ? 'primary destructive' : 'secondary'}" onclick="respondToPrompt('3')">No</button>
          `;
          break;

        case 'yesNo':
          content.innerHTML = `<p>${escapeHtml(question)}</p>`;
          const yesClass2 = prompt.isDestructive ? 'secondary' : 'primary';
          const noClass2 = prompt.isDestructive ? 'primary destructive' : 'secondary';
          actions.innerHTML = `
            <button class="prompt-btn ${yesClass2}" onclick="respondToPrompt('y')">Yes</button>
            <button class="prompt-btn ${noClass2}" onclick="respondToPrompt('n')">No</button>
          `;
          break;

        case 'multiChoice':
          let multiHtml = prompt.subagentId ? `<div class="subagent-context">🤖 Subagent: ${prompt.subagentId.substring(0, 7)}</div>` : '';
          multiHtml += `<p>${escapeHtml(question)}</p>`;
          content.innerHTML = multiHtml;
          const useDropdown = prompt.options.length > 5 && !prompt.multiSelect;
          const isMulti = prompt.multiSelect;
          if (useDropdown) {
            content.innerHTML += `
              <select class="prompt-select" id="promptSelect">
                <option value="">Select an option...</option>
                ${prompt.options.map(opt => `<option value="${opt.num}">${escapeHtml(opt.num)}. ${escapeHtml(opt.text)}</option>`).join('')}
              </select>
            `;
            actions.innerHTML = `<button class="prompt-btn primary" onclick="submitDropdownChoice()">Select</button>`;
          } else {
            content.innerHTML += `<div class="prompt-options-scroll" data-multi="${isMulti}">
              ${prompt.options.map((opt, i) => `
                <div class="prompt-option" data-value="${opt.num}" onclick="selectOption(this, ${isMulti})" tabindex="0" role="${isMulti ? 'checkbox' : 'radio'}" aria-checked="false">
                  <span>${isMulti ? '☐ ' : ''}${escapeHtml(opt.num)}. ${escapeHtml(opt.text)}</span>
                </div>
              `).join('')}
            </div>`;
            actions.innerHTML = `<button class="prompt-btn primary" onclick="submitChoice(${isMulti})">Select</button>`;
          }
          break;

        case 'freeForm':
          content.innerHTML = `
            <p>${escapeHtml(question)}</p>
            <textarea class="prompt-input" id="promptInput" placeholder="Type your response..." rows="2"></textarea>
          `;
          actions.innerHTML = `<button class="prompt-btn primary" onclick="submitFreeform()">Send</button>`;
          setTimeout(() => document.getElementById('promptInput')?.focus(), 100);
          break;
      }

      // Add freeform input to all prompt types except freeForm (which already has one)
      if (prompt.type !== 'freeForm') {
        content.innerHTML += `
          <div class="prompt-freeform">
            <input type="text" id="promptFreeformInput" placeholder="Or type a custom response..."
                   onkeydown="if(event.key==='Enter')respondToPromptFreeform()">
            <button onclick="respondToPromptFreeform()">Send</button>
          </div>
        `;
      }

      card.classList.remove('loading', 'stale');

      // Focus first interactive element for accessibility
      setTimeout(() => {
        const firstInteractive = card.querySelector('button, input, textarea, select, .prompt-option');
        firstInteractive?.focus();
      }, 100);

      // Voice: read the prompt, then listen
      if (settings.ttsEnabled) {
        speakThenListen(`Claude is asking: ${question}`);
      }

      // Setup keyboard navigation for options
      setupOptionKeyboardNav();
    }

    function setupOptionKeyboardNav() {
      const card = document.getElementById('promptCard');
      card.onkeydown = (e) => {
        const options = [...card.querySelectorAll('.prompt-option')];
        if (options.length === 0) return;

        if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault();
          const current = options.findIndex(o => o.classList.contains('selected'));
          let next;
          if (e.key === 'ArrowDown') {
            next = current < 0 ? 0 : (current + 1) % options.length;
          } else {
            next = current < 0 ? options.length - 1 : (current - 1 + options.length) % options.length;
          }
          const isMulti = card.querySelector('.prompt-options-scroll')?.dataset.multi === 'true';
          selectOption(options[next], isMulti);
          options[next].focus();
        } else if (e.key === 'Enter' && document.activeElement?.classList.contains('prompt-option')) {
          e.preventDefault();
          const isMulti = card.querySelector('.prompt-options-scroll')?.dataset.multi === 'true';
          submitChoice(isMulti);
        } else if (e.key === ' ' && document.activeElement?.classList.contains('prompt-option')) {
          // Space toggles selection in multi-select mode
          e.preventDefault();
          const isMulti = card.querySelector('.prompt-options-scroll')?.dataset.multi === 'true';
          if (isMulti) {
            selectOption(document.activeElement, true);
          }
        }
      };
    }

    // Format permission display based on tool type
    function formatPermissionDisplay(tool, input) {
      if (typeof input === 'string') return input; // Already formatted
      switch(tool) {
        case 'Bash':
          return input?.command || 'Run command';
        case 'WebFetch':
          return sanitizeUrl(input?.url) || 'Fetch URL';
        case 'Edit':
        case 'Write':
        case 'MultiEdit':
          return input?.file_path || 'Modify file';
        case 'NotebookEdit':
          return input?.notebook_path || 'Edit notebook';
        default:
          // MCP tools - show truncated JSON input
          if (typeof input === 'object') {
            const str = JSON.stringify(input, null, 2);
            return str.length > 200 ? str.substring(0, 200) + '...' : str;
          }
          return String(input || 'Execute');
      }
    }

    // Sanitize URLs to remove potentially sensitive query params
    function sanitizeUrl(url) {
      if (!url) return null;
      try {
        const parsed = new URL(url);
        return `${parsed.protocol}//${parsed.host}${parsed.pathname}`;
      } catch {
        return url;
      }
    }

    // Track which tools have been "always allowed" (local tracking for UI only)
    const alwaysAllowedTools = new Set();

    // Handle permission response with tool tracking
    function respondToPermission(response, tool) {
      if (response === '1' && tool) {
        alwaysAllowedTools.add(tool);
      }
      respondToPrompt(response);
    }

    function respondToPrompt(response) {
      const card = document.getElementById('promptCard');
      card.classList.add('loading');

      // Haptic feedback
      navigator.vibrate?.(50);

      // Send response
      const success = wsSend({ action: 'inject', command: response });

      if (success) {
        recentUserMessages.push(response);
        if (recentUserMessages.length > 10) recentUserMessages.shift();
        appendMessage({ type: 'user', content: response });
        if (settings.ttsEnabled) {
          speak(`Sent: ${response}`);
        }
        setTimeout(() => hidePromptCard(), 300);
      } else {
        card.classList.remove('loading');
        showToast('Failed to send response', 'error');
      }
    }

    function respondToPromptFreeform() {
      const input = document.getElementById('promptFreeformInput');
      const text = input?.value?.trim();
      if (text) {
        respondToPrompt(text);
      } else {
        showToast('Please enter a response', 'error');
      }
    }

    function selectOption(el, isMulti = false) {
      if (isMulti) {
        // Toggle selection for multi-select
        const isSelected = el.classList.toggle('selected');
        el.setAttribute('aria-checked', isSelected ? 'true' : 'false');
        // Update checkbox visual
        const span = el.querySelector('span');
        if (span) {
          span.textContent = span.textContent.replace(/^[☐☑] /, isSelected ? '☑ ' : '☐ ');
        }
      } else {
        // Single select - toggle if clicking same option, otherwise switch
        const wasSelected = el.classList.contains('selected');
        document.querySelectorAll('.prompt-option').forEach(o => {
          o.classList.remove('selected');
          o.setAttribute('aria-checked', 'false');
        });
        if (!wasSelected) {
          el.classList.add('selected');
          el.setAttribute('aria-checked', 'true');
        }
        // If wasSelected, clicking again deselects it (allows freeform input)
      }
    }

    async function submitChoice(isMulti = false) {
      const selected = document.querySelectorAll('.prompt-option.selected');
      if (selected.length > 0) {
        if (isMulti && selected.length > 1) {
          // Multi-select: send each selection sequentially with long delays
          // Claude Code expects: type "1" Enter (toggle), type "3" Enter (toggle), Enter (submit)
          const card = document.getElementById('promptCard');
          card.classList.add('loading');
          navigator.vibrate?.(50);

          const values = Array.from(selected).map(el => el.dataset.value);
          try {
            for (let i = 0; i < values.length; i++) {
              showToast(`Selecting option ${values[i]}...`, 'info');
              await injectAndWait(values[i]);
              // Long delay to ensure terminal processes the keystroke
              await new Promise(r => setTimeout(r, 1000));
            }
            // Final empty Enter to submit selections
            showToast('Submitting...', 'info');
            await injectAndWait('');
            appendMessage({ type: 'user', content: values.join(', ') });
            hidePromptCard();
          } catch (e) {
            console.error('Multi-select failed:', e);
            showToast('Multi-select failed: ' + e.message, 'error');
            card.classList.remove('loading');
          }
        } else {
          respondToPrompt(selected[0].dataset.value);
        }
      } else {
        showToast('Please select an option', 'error');
      }
    }

    function submitDropdownChoice() {
      const select = document.getElementById('promptSelect');
      if (select?.value) {
        respondToPrompt(select.value);
      } else {
        showToast('Please select an option', 'error');
      }
    }

    function submitFreeform() {
      const input = document.getElementById('promptInput');
      if (input?.value.trim()) {
        respondToPrompt(input.value.trim());
      } else {
        showToast('Please enter a response', 'error');
      }
    }

    function hidePromptCard() {
      const card = document.getElementById('promptCard');
      card.classList.remove('show', 'loading', 'stale');
      currentPrompt = null;
    }

    function dismissPrompt() {
      hidePromptCard();
      showToast('You can still respond in the text input', 'info');
    }

    function checkPromptStaleness() {
      if (!currentPrompt) return;
      const currentCount = document.querySelectorAll('.message').length;
      if (currentCount > promptMessageIndex + 2) {
        document.getElementById('promptCard').classList.add('stale');
      }
    }

    // ============================================
    // Status Bar and Token Tracking
    // ============================================
    let sessionTokens = { input: 0, output: 0 };
    let statusTimeout = null;

    function handleStatusUpdate(data) {
      const statusBar = document.getElementById('statusBar');
      const statusVerb = document.getElementById('statusVerb');

      statusBar.classList.remove('hidden');
      statusVerb.textContent = data.text || 'Working...';

      // Auto-hide after 5 seconds of no updates
      clearTimeout(statusTimeout);
      statusTimeout = setTimeout(() => {
        statusBar.classList.add('hidden');
      }, 5000);
    }

    function handleTokenUsage(data) {
      sessionTokens.input += data.input || 0;
      sessionTokens.output += data.output || 0;

      document.getElementById('tokenInput').textContent = formatTokens(sessionTokens.input);
      document.getElementById('tokenOutput').textContent = formatTokens(sessionTokens.output);

      // Show the status bar when we receive token updates
      const statusBar = document.getElementById('statusBar');
      statusBar.classList.remove('hidden');

      clearTimeout(statusTimeout);
      statusTimeout = setTimeout(() => {
        statusBar.classList.add('hidden');
      }, 5000);
    }

    function formatTokens(n) {
      if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
      if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
      return n.toString();
    }

    function resetSessionTokens() {
      sessionTokens = { input: 0, output: 0 };
      document.getElementById('tokenInput').textContent = '0';
      document.getElementById('tokenOutput').textContent = '0';
    }

    // ============================================
    // Task Progress Panel
    // ============================================
    const tasks = new Map(); // id -> { subject, status, description, activeForm }
    let taskPanelExpanded = true;
    let pendingSubagentInfo = null;

    function handleTaskCreate(data) {
      tasks.set(data.id, {
        subject: data.subject,
        status: data.status || 'pending',
        description: data.description,
        activeForm: data.activeForm
      });
      renderTasks();
    }

    function handleTaskUpdate(data) {
      const task = tasks.get(data.id);
      if (task) {
        if (data.status) task.status = data.status;
        if (data.subject) task.subject = data.subject;
        renderTasks();
      }
    }

    function handleTaskList(data) {
      // Replace all tasks with the authoritative list
      tasks.clear();
      if (data.tasks && Array.isArray(data.tasks)) {
        for (const task of data.tasks) {
          tasks.set(task.id, {
            subject: task.subject,
            status: task.status,
            description: task.description || ''
          });
        }
      }
      renderTasks();
    }

    function toggleTaskPanel() {
      taskPanelExpanded = !taskPanelExpanded;
      const list = document.getElementById('taskList');
      const icon = document.querySelector('.task-panel .expand-icon');
      if (list) list.classList.toggle('collapsed', !taskPanelExpanded);
      if (icon) icon.innerHTML = taskPanelExpanded ? '&#9660;' : '&#9654;';
    }

    function renderTasks() {
      const panel = document.getElementById('taskPanel');
      const list = document.getElementById('taskList');
      const progress = document.getElementById('taskProgress');

      if (!panel || !list || !progress) return;

      if (tasks.size === 0) {
        panel.classList.add('hidden');
        return;
      }

      panel.classList.remove('hidden');

      const completed = [...tasks.values()].filter(t => t.status === 'completed').length;
      progress.textContent = `${completed}/${tasks.size}`;

      list.innerHTML = [...tasks.entries()].map(([id, task]) => {
        const checkboxClass = task.status === 'completed' ? 'checked' :
                              task.status === 'in_progress' ? 'in-progress' : '';
        const checkmark = task.status === 'completed' ? '&#10003;' :
                          task.status === 'in_progress' ? '&#8226;' : '';
        return `
          <div class="task-item ${task.status}">
            <div class="task-checkbox ${checkboxClass}">${checkmark}</div>
            <span>${escapeHtml(task.subject || '')}</span>
          </div>
        `;
      }).join('');
    }

    function clearTasks() {
      tasks.clear();
      renderTasks();
    }

    // ============================================
    // Subagent Handling
    // ============================================
    function updateSubagentIndicator() {
      const indicator = document.getElementById('subagentIndicator');
      const count = activeSubagents.size;

      if (count === 0) {
        indicator.classList.add('hidden');
      } else {
        indicator.classList.remove('hidden');
        indicator.querySelector('.subagent-count').textContent = count;

        // Build list of active subagents with enhanced details
        const list = indicator.querySelector('.subagent-list');
        list.innerHTML = '';
        activeSubagents.forEach((data, agentId) => {
          const item = document.createElement('div');
          item.className = 'subagent-item';

          const statusIcon = data.status === 'waiting' ? '⏳' : '🔄';
          const name = data.description || agentId.substring(0, 8);
          const toolInfo = data.currentTool ? `Using: ${data.currentTool}` : 'Working...';
          const tokens = (data.inputTokens || data.outputTokens) ?
            `${formatTokens(data.inputTokens || 0)} in / ${formatTokens(data.outputTokens || 0)} out` : '';

          item.innerHTML = `
            <div style="font-weight:500">${statusIcon} ${escapeHtml(name)}</div>
            <div style="font-size:0.7rem;color:var(--accent)">${toolInfo}</div>
            ${tokens ? `<div style="font-size:0.65rem;color:var(--text-secondary);font-family:monospace">${tokens}</div>` : ''}
          `;
          list.appendChild(item);
        });
      }
    }

    function handleSubagentOutput(agentId, data) {
      // Update subagent activity tracking
      const subagent = activeSubagents.get(agentId);
      if (subagent) {
        subagent.lastActivity = Date.now();

        // Update description based on message type
        if (data.type === 'tool') {
          subagent.description = `Using ${data.tool}`;
          subagent.status = 'running';
        } else if (data.type === 'assistant') {
          subagent.description = data.content?.substring(0, 30) + '...' || 'Thinking...';
        }

        // Check if it's waiting for input
        if (data.type === 'permission_request' || data.type === 'ask_user_question') {
          subagent.status = 'waiting';
          subagent.description = 'Waiting for input';
        }

        updateSubagentIndicator();
      }

      // Handle tool_result FIRST - cancel pending permission or dismiss shown card
      if (data.type === 'tool_result') {
        // Cancel pending permission card (auto-approved before delay)
        const pending = pendingSubagentPermissions.get(agentId);
        if (pending) {
          clearTimeout(pending.timeout);
          pendingSubagentPermissions.delete(agentId);
        }
        // Dismiss shown permission card
        if (currentPrompt?.type === 'permission' && currentPrompt?.subagentId === agentId) {
          hidePromptCard();
        }
        return;
      }

      // Handle subagent permission requests with delay (allows auto-approve to cancel)
      if (data.type === 'permission_request') {
        const input = data.input || {};
        const tool = data.tool;
        const cmd = tool === 'Bash' ? (input.command || '') : `${tool}: ${input.file_path || 'unknown'}`;
        const isDestructive = tool === 'Bash' && /\brm\b|\bdelete\b|\bdrop\b/.test(cmd.toLowerCase());

        // Cancel any existing pending permission for this subagent
        const existing = pendingSubagentPermissions.get(agentId);
        if (existing) clearTimeout(existing.timeout);

        // Delay showing card - if tool_result comes quickly, it was auto-approved
        const timeout = setTimeout(() => {
          pendingSubagentPermissions.delete(agentId);
          showPromptCard({
            type: 'permission',
            text: `Allow ${tool}?`,
            command: cmd,
            isDestructive: isDestructive,
            subagentId: agentId
          });
        }, PERMISSION_CARD_DELAY_MS);

        pendingSubagentPermissions.set(agentId, { timeout, tool, cmd, isDestructive });
        return;
      }

      // Handle subagent AskUserQuestion
      if (data.type === 'ask_user_question') {
        showStructuredPrompt(data.questions, agentId);
        return;
      }

      // Subagent activity shown in indicator only - don't spam output
    }

    function appendSubagentMessage(agentId, data) {
      const outputArea = document.getElementById('outputArea');
      const div = document.createElement('div');
      div.className = `message ${data.type} subagent-message`;
      div.dataset.subagent = agentId;

      const prefix = document.createElement('span');
      prefix.className = 'subagent-prefix';
      prefix.textContent = `[${agentId.substring(0, 7)}] `;

      if (data.type === 'assistant') {
        div.appendChild(prefix);
        div.appendChild(document.createTextNode(data.content));
      } else if (data.type === 'tool') {
        div.appendChild(prefix);
        const toolSpan = document.createElement('span');
        toolSpan.className = 'tool-name';
        toolSpan.textContent = data.tool;
        div.appendChild(toolSpan);
      } else if (data.type === 'tool_result') {
        div.appendChild(prefix);
        div.appendChild(document.createTextNode(data.result?.substring(0, 100) || '(completed)'));
      }

      outputArea.appendChild(div);
      outputArea.scrollTop = outputArea.scrollHeight;

      // Trim messages if too many
      while (outputArea.children.length > MAX_MESSAGES) {
        outputArea.removeChild(outputArea.firstChild);
      }
    }

    // Voice integration for prompts
    function speakThenListen(text) {
      if (!settings.ttsEnabled || !synth) return;

      // Stop any current listening
      if (recognition && isRecording) {
        recognition.stop();
        isRecording = false;
      }

      synth.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = settings.speechRate;

      if (settings.voiceURI !== 'default') {
        const voices = synth.getVoices();
        const voice = voices.find(v => v.voiceURI === settings.voiceURI);
        if (voice) utterance.voice = voice;
      }

      utterance.onend = () => {
        // Wait before starting listening for response (avoids TTS echo detection)
        setTimeout(() => {
          if (currentPrompt && recognition) {
            startListeningForPromptResponse();
          }
        }, VOICE_LISTEN_DELAY_MS);
      };

      synth.speak(utterance);
    }

    function startListeningForPromptResponse() {
      if (!recognition || isRecording) return;

      recognition.start();
      isRecording = true;
      document.getElementById('voiceBtn')?.classList.add('recording');
    }

    function handleVoicePromptResponse(transcript) {
      if (!currentPrompt) return false;

      const text = transcript.toLowerCase().trim();

      // Yes responses
      if (['yes', 'yeah', 'yep', 'okay', 'ok', 'proceed', 'sure', 'go ahead', 'do it'].includes(text)) {
        respondToPrompt('y');
        return true;
      }

      // No responses
      if (['no', 'nope', 'cancel', 'stop', "don't", 'abort', 'negative'].includes(text)) {
        respondToPrompt('n');
        return true;
      }

      // Option selection (for multi-choice)
      if (currentPrompt.type === 'multiChoice') {
        const optionMatch = text.match(/^(?:option\s+)?(\d+|one|two|three|four|five|first|second|third|fourth|fifth)$/i);
        if (optionMatch) {
          const numMap = { one: '1', two: '2', three: '3', four: '4', five: '5', first: '1', second: '2', third: '3', fourth: '4', fifth: '5' };
          const num = numMap[optionMatch[1].toLowerCase()] || optionMatch[1];
          respondToPrompt(num);
          return true;
        }
      }

      // Free-form: use the transcript as-is
      if (currentPrompt.type === 'freeForm') {
        respondToPrompt(transcript);
        return true;
      }

      return false;
    }

    // Viewport handling for keyboard
    function setupViewportHandling() {
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', adjustPromptCardPosition);
      }
    }

    function adjustPromptCardPosition() {
      const card = document.getElementById('promptCard');
      if (!card.classList.contains('show')) return;

      const viewport = window.visualViewport;
      if (viewport) {
        const keyboardHeight = window.innerHeight - viewport.height;
        if (keyboardHeight > 100) {
          // Keyboard is visible
          card.style.bottom = (keyboardHeight + 10) + 'px';
        } else {
          card.style.bottom = '180px';
        }
      }
    }

    // Initialize viewport handling
    document.addEventListener('DOMContentLoaded', setupViewportHandling);

    // ============================================
    // Syntax Highlighting (Prism.js)
    // ============================================
    let prismLoaded = false;

    // SRI hashes for Prism.js CDN resources (security)
    const PRISM_SRI = {
      core: 'sha512-5BmBkPa0dCoqHc1APXLQjZhyRw6sl0RQDF1LvvqNGprNGOt8YLhTwP/RaG/mHDfSPMC7f7O+GQGHJLw+b+Kw6A==',
      // Language components use CDN versioning for integrity
    };

    function loadPrism() {
      if (prismLoaded) return Promise.resolve();
      return new Promise((resolve) => {
        const script = document.createElement('script');
        script.src = 'https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js';
        script.integrity = PRISM_SRI.core;
        script.crossOrigin = 'anonymous';
        script.onload = () => {
          // Load common language components
          const languages = ['javascript', 'typescript', 'python', 'bash', 'json', 'ruby', 'css', 'markup'];
          let loaded = 0;
          languages.forEach(lang => {
            const langScript = document.createElement('script');
            langScript.src = `https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-${lang}.min.js`;
            langScript.crossOrigin = 'anonymous';
            langScript.onload = () => { if (++loaded === languages.length) { prismLoaded = true; resolve(); } };
            langScript.onerror = () => { if (++loaded === languages.length) { prismLoaded = true; resolve(); } };
            document.head.appendChild(langScript);
          });
        };
        script.onerror = resolve; // Graceful fallback if CDN fails
        document.head.appendChild(script);
      });
    }

    function detectLanguage(toolInput) {
      if (!toolInput) return 'plaintext';
      const filePath = toolInput.file_path || toolInput.path || '';
      const ext = filePath.split('.').pop()?.toLowerCase();
      const map = {
        js: 'javascript', jsx: 'javascript', mjs: 'javascript',
        ts: 'typescript', tsx: 'typescript',
        py: 'python',
        rb: 'ruby',
        sh: 'bash', bash: 'bash', zsh: 'bash',
        json: 'json',
        css: 'css', scss: 'css',
        html: 'markup', htm: 'markup', xml: 'markup', svg: 'markup',
        md: 'markdown'
      };
      return map[ext] || 'plaintext';
    }

    function highlightCode(preElement, language) {
      if (!prismLoaded || !window.Prism) return;
      const code = preElement.textContent;
      const lines = code.split('\n').length;
      // Skip highlighting for very large outputs (performance)
      if (lines > 500) return;

      try {
        const grammar = Prism.languages[language] || Prism.languages.plaintext;
        if (grammar) {
          preElement.innerHTML = Prism.highlight(code, grammar, language);
          preElement.classList.add(`language-${language}`);
        }
      } catch (e) {
        // Silently fail - plain text is fine
      }
    }
  </script>
</body>
</html>
